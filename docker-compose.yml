services:
  neo4j:
    image: neo4j:5-community
    container_name: kloc-neo4j
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-kloc-intelligence}"
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2g}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-512m}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: kloc-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # MCP server over Streamable HTTP. Opt-in via `--profile mcp` so the default
  # `docker compose up -d` still brings only the databases.
  #
  #   docker compose --profile mcp up -d
  #   curl http://localhost:8765/health
  #
  # No built-in auth or TLS — the host port is bound to 127.0.0.1 by default.
  # Front it with a reverse proxy or run on a trusted network for remote access.
  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kloc-intelligence:latest
    container_name: kloc-mcp-server
    profiles: ["mcp"]
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-8765}:8765"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-kloc-intelligence}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      QDRANT_URL: "http://qdrant:6333"
      # Pass through optional AI provider config — kloc_search / kloc_explain
      # will surface a clear error if these are unset and a caller invokes them.
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      KLOC_FLOW_NAMESPACES: "${KLOC_FLOW_NAMESPACES:-}"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=2).status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
