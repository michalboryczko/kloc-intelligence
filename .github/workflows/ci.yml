name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.x"

jobs:
  lint:
    name: Lint + Format + Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev + ai dependencies
        run: uv sync --extra dev --extra ai

      - name: Ruff lint
        run: uv run ruff check src tests benchmarks

      - name: Ruff format
        run: uv run ruff format --check src tests benchmarks

      - name: Mypy
        run: uv run mypy src

  test:
    name: Unit + Integration tests
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/kloc-intelligence
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p kloc-intelligence 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: kloc-intelligence
      QDRANT_URL: http://localhost:6333
      # Captures secret presence so we can use it in step-level `if:` —
      # secrets can't be compared directly in `if:` on all runner versions.
      HAS_KLOC_FULL_TOKEN: ${{ secrets.KLOC_FULL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout kloc-full (parent monorepo) for snapshot + contract fixtures
        # The snapshot, contract and integration test suites read fixtures
        # via `Path(__file__).parent.parent.parent`, which resolves one
        # level above ${GITHUB_WORKSPACE}. Cloning kloc-full and copying
        # its tests/, kloc-contracts/, artifacts/ subdirs to that parent
        # makes the fixtures available. The step is skipped when
        # KLOC_FULL_TOKEN isn't set; tests then auto-skip the fixture-
        # dependent cases.
        if: env.HAS_KLOC_FULL_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: michalboryczko/kloc-full
          path: _kloc-full
          token: ${{ secrets.KLOC_FULL_TOKEN }}

      - name: Stage kloc-full fixtures one level above the workspace
        if: env.HAS_KLOC_FULL_TOKEN == 'true'
        run: |
          set -euo pipefail
          parent="$(dirname "${GITHUB_WORKSPACE}")"
          for sub in tests kloc-contracts artifacts; do
            if [ -d "_kloc-full/$sub" ]; then
              rm -rf "$parent/$sub"
              cp -r "_kloc-full/$sub" "$parent/$sub"
              echo "Staged $sub -> $parent/$sub"
            else
              echo "Skipping (not in kloc-full): $sub"
            fi
          done
          rm -rf _kloc-full

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev + ai dependencies
        run: uv sync --extra dev --extra ai

      - name: Run pytest
        # test_flow_enricher.py needs a real PHP project + Haystack pipeline;
        # always deselected in CI. Every other test is fixture-tolerant: when
        # kloc-full fixtures are present they exercise the snapshot, contract,
        # and integration paths; when absent (no KLOC_FULL_TOKEN), the affected
        # tests pytest.skip rather than erroring.
        run: |
          uv run pytest \
            --deselect tests/test_flow_enricher.py \
            -q --no-header

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build sdist + wheel
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
