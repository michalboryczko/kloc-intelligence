[project]
name = "kloc-intelligence"
version = "0.1.0"
description = "Graph-native code intelligence platform for PHP, backed by Neo4j + Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0,<7.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "msgspec>=0.18.0",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "haystack-ai>=2.6.0",
    "qdrant-haystack>=5.0.0",
    "qdrant-client>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "jsonschema>=4.26.0",
    "httpx>=0.27",
]

[project.scripts]
kloc-intelligence = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff (lint + format) ────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line-too-long (formatter handles this)
    "B007",   # unused-loop-variable (idiomatic in tuple-iteration code)
    "B008",   # function call in default arg (Typer/Pydantic patterns)
    "B905",   # zip without strict (case-by-case judgment)
    "SIM102", # nested-if (sometimes more readable)
    "SIM105", # contextlib.suppress (try/except/pass is fine)
    "SIM108", # ternary vs if/else (readability call)
    "SIM117", # multiple-with-statements (long Cypher tests get worse)
    "C408",   # dict() vs {} (matter of taste)
    "RUF003", # ambiguous-unicode in comments (en-dashes/em-dashes are intentional)
    "RUF012", # mutable class attributes (false positive on dataclass defaults)
    "RUF015", # next(iter(...)) vs [0] (case-by-case)
    "RUF059", # unused-unpacked-variable (idiomatic destructuring)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",  # module-level import not at top (pytest.importorskip pattern)
    "F401",  # unused imports (test fixtures)
    "B011",  # assert False (intentional in tests)
]
"benchmarks/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ────────────────────────────────────────────────────────────────────
# Type-checking is run advisory at the moment — many graph-traversal modules
# return Neo4j Record/dict[Any,Any] types that mypy can't narrow without a
# wrapper layer. Modules that have been type-cleaned are checked strictly;
# others are kept in `ignore_errors = true` until they get their pass.
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "src.ai.*"
ignore_errors = true                # Haystack types are too dynamic for useful checks

[[tool.mypy.overrides]]
# Modules pending a typing cleanup pass.
module = [
    "src.cli",
    "src.db.importer",
    "src.db.schema",
    "src.orchestration.class_context",
    "src.orchestration.interface_context",
    "src.orchestration.property_context",
]
ignore_errors = true

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "snapshot: Snapshot comparison tests (require Neo4j + test data)",
]
filterwarnings = [
    "ignore::DeprecationWarning:haystack.*",
    "ignore::DeprecationWarning:qdrant_haystack.*",
]
